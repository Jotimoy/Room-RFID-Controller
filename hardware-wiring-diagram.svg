<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Arduino Nano RC522 and two-channel relay wiring diagram</title>
  <desc id="desc">Low-voltage control wiring for an Arduino Nano room RFID controller. The RC522 connects through SPI. The two-channel relay input connects to D6 and D7. A separate 5 volt relay supply shares ground with the Nano.</desc>
  <style>
    .title { font: 700 28px Arial, sans-serif; fill: #102a43; }
    .subtitle { font: 16px Arial, sans-serif; fill: #486581; }
    .box-title { font: 700 22px Arial, sans-serif; fill: #fff; }
    .pin { font: 15px monospace; fill: #102a43; }
    .label { font: 14px Arial, sans-serif; fill: #102a43; }
    .small { font: 13px Arial, sans-serif; fill: #486581; }
    .warn { font: 700 15px Arial, sans-serif; fill: #9b1c1c; }
    .wire-label { font: 700 13px Arial, sans-serif; }
  </style>
  <rect width="1200" height="820" fill="#f7fafc"/>
  <text x="600" y="45" text-anchor="middle" class="title">Room RFID Controller — Hardware Wiring</text>
  <text x="600" y="72" text-anchor="middle" class="subtitle">Arduino Nano + RC522 RFID reader + 2-channel relay module</text>

  <!-- Arduino Nano -->
  <rect x="435" y="145" width="300" height="520" rx="18" fill="#e6fffa" stroke="#0f766e" stroke-width="3"/>
  <rect x="435" y="145" width="300" height="52" rx="18" fill="#0f766e"/>
  <rect x="435" y="179" width="300" height="18" fill="#0f766e"/>
  <text x="585" y="179" text-anchor="middle" class="box-title">ARDUINO NANO</text>
  <text x="585" y="220" text-anchor="middle" class="small">Type-C or Mini-USB version</text>
  <circle cx="585" cy="390" r="75" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/>
  <text x="585" y="385" text-anchor="middle" class="label">ATmega328P</text>
  <text x="585" y="407" text-anchor="middle" class="small">controller</text>
  <text x="460" y="265" class="pin">3.3V</text><circle cx="438" cy="260" r="6" fill="#eab308"/>
  <text x="460" y="300" class="pin">GND</text><circle cx="438" cy="295" r="6" fill="#111827"/>
  <text x="460" y="335" class="pin">D9  (RST)</text><circle cx="438" cy="330" r="6" fill="#a855f7"/>
  <text x="460" y="370" class="pin">D10 (SS)</text><circle cx="438" cy="365" r="6" fill="#f97316"/>
  <text x="460" y="405" class="pin">D11 (MOSI)</text><circle cx="438" cy="400" r="6" fill="#2563eb"/>
  <text x="460" y="440" class="pin">D12 (MISO)</text><circle cx="438" cy="435" r="6" fill="#14b8a6"/>
  <text x="460" y="475" class="pin">D13 (SCK)</text><circle cx="438" cy="470" r="6" fill="#ec4899"/>
  <text x="620" y="535" class="pin">D6  (IN1)</text><circle cx="732" cy="530" r="6" fill="#2563eb"/>
  <text x="620" y="570" class="pin">D7  (IN2)</text><circle cx="732" cy="565" r="6" fill="#f97316"/>
  <text x="620" y="605" class="pin">GND</text><circle cx="732" cy="600" r="6" fill="#111827"/>

  <!-- RC522 -->
  <rect x="40" y="150" width="280" height="400" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
  <rect x="40" y="150" width="280" height="52" rx="18" fill="#1d4ed8"/>
  <rect x="40" y="184" width="280" height="18" fill="#1d4ed8"/>
  <text x="180" y="184" text-anchor="middle" class="box-title">RC522 RFID READER</text>
  <rect x="97" y="230" width="166" height="145" rx="70" fill="none" stroke="#60a5fa" stroke-width="14"/>
  <rect x="118" y="250" width="124" height="105" rx="50" fill="none" stroke="#93c5fd" stroke-width="7"/>
  <text x="180" y="405" text-anchor="middle" class="small">Power from 3.3V only</text>
  <text x="245" y="445" class="pin">3.3V</text><circle cx="318" cy="440" r="6" fill="#eab308"/>
  <text x="245" y="475" class="pin">GND</text><circle cx="318" cy="470" r="6" fill="#111827"/>
  <text x="245" y="505" class="pin">RST</text><circle cx="318" cy="500" r="6" fill="#a855f7"/>
  <text x="245" y="535" class="pin">SDA / SS</text><circle cx="318" cy="530" r="6" fill="#f97316"/>
  <text x="245" y="565" class="pin">MOSI</text><circle cx="318" cy="560" r="6" fill="#2563eb"/>
  <text x="245" y="595" class="pin">MISO</text><circle cx="318" cy="590" r="6" fill="#14b8a6"/>
  <text x="245" y="625" class="pin">SCK</text><circle cx="318" cy="620" r="6" fill="#ec4899"/>

  <!-- Relay -->
  <rect x="865" y="310" width="295" height="330" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
  <rect x="865" y="310" width="295" height="52" rx="18" fill="#c2410c"/>
  <rect x="865" y="344" width="295" height="18" fill="#c2410c"/>
  <text x="1012" y="344" text-anchor="middle" class="box-title">2-CHANNEL RELAY</text>
  <text x="890" y="405" class="pin">IN1</text><circle cx="868" cy="400" r="6" fill="#2563eb"/>
  <text x="890" y="440" class="pin">IN2</text><circle cx="868" cy="435" r="6" fill="#f97316"/>
  <text x="890" y="475" class="pin">GND</text><circle cx="868" cy="470" r="6" fill="#111827"/>
  <text x="890" y="510" class="pin">VCC (5V)</text><circle cx="868" cy="505" r="6" fill="#dc2626"/>
  <rect x="1000" y="405" width="120" height="48" rx="7" fill="#fed7aa" stroke="#c2410c"/>
  <text x="1060" y="434" text-anchor="middle" class="label">Relay 1</text>
  <rect x="1000" y="475" width="120" height="48" rx="7" fill="#fed7aa" stroke="#c2410c"/>
  <text x="1060" y="504" text-anchor="middle" class="label">Relay 2</text>
  <text x="1012" y="575" text-anchor="middle" class="small">COM / NO / NC terminals</text>
  <text x="1012" y="598" text-anchor="middle" class="small">are load-side wiring</text>

  <!-- Separate supply -->
  <rect x="885" y="680" width="240" height="66" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1005" y="709" text-anchor="middle" class="label">Separate 5V relay supply</text>
  <text x="1005" y="731" text-anchor="middle" class="small">share GND with Nano</text>

  <!-- RC522 wires -->
  <path d="M318 440 H380 V260 H438" fill="none" stroke="#eab308" stroke-width="4"/>
  <path d="M318 470 H370 V295 H438" fill="none" stroke="#111827" stroke-width="4"/>
  <path d="M318 500 H360 V330 H438" fill="none" stroke="#a855f7" stroke-width="4"/>
  <path d="M318 530 H350 V365 H438" fill="none" stroke="#f97316" stroke-width="4"/>
  <path d="M318 560 H340 V400 H438" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M318 590 H330 V435 H438" fill="none" stroke="#14b8a6" stroke-width="4"/>
  <path d="M318 620 H320 V470 H438" fill="none" stroke="#ec4899" stroke-width="4"/>

  <!-- Relay signal and ground wires -->
  <path d="M732 530 H800 V400 H868" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M732 565 H810 V435 H868" fill="none" stroke="#f97316" stroke-width="4"/>
  <path d="M732 600 H820 V470 H868" fill="none" stroke="#111827" stroke-width="4"/>
  <path d="M1005 680 V505 H868" fill="none" stroke="#dc2626" stroke-width="4"/>
  <path d="M975 746 V770 H780 V600 H732" fill="none" stroke="#111827" stroke-width="4"/>

  <rect x="48" y="700" width="720" height="72" rx="10" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/>
  <text x="68" y="730" class="warn">SAFETY:</text>
  <text x="150" y="730" class="label">Do not connect Arduino or RC522 to AC mains. Use a qualified electrician for mains/load wiring.</text>
  <text x="68" y="754" class="small">The diagram shows low-voltage connections only. Relay COM/NO/NC wiring depends on the load and local electrical code.</text>
</svg>
